<!DOCTYPE html>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<html lang="zh-CN" data-page-node-id="M9gZwUla21TtF3s8U295FD">
<head data-page-node-id="B8dW9trlFpXdAXoMdq0JA0">
<meta charset="UTF-8" data-page-node-id="Gwpl2YcDFnT2o3jjERUmQg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="dvU9eTU66vwYMF7fvD46gp">
<meta name="apple-mobile-web-app-capable" content="yes" data-page-node-id="NOkMRkL6F4dozKCOKp89IR">
<meta name="apple-mobile-web-app-status-bar-style" content="default" data-page-node-id="dqtLWfZGHkqYuudblnpdIz">
<title>GTM 单任务专注台</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e6e8eb; --line2:#f0f1f3;
  --tx:#1a1d21; --tx2:#5b6472; --tx3:#8b95a3;
  --pri:#ec4899; --pri-l:#fdeef6; --pri-d:#c81e6e;
  --red:#e5484d; --red-l:#fdeced;
  --grn:#16a34a; --grn-l:#e8f7ee;
  --org:#f59e0b; --org-l:#fff5e6;
  --pur:#7c3aed; --pur-l:#f3edff;
  --r:14px; --r2:10px;
  --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --sh2:0 4px 16px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 0}
svg{display:block;flex-shrink:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
.hide{display:none !important}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hd-l{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--pri),#f977b9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(236,72,153,.3)}
.hd h1{font-size:19px;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
.hd .sub{font-size:12.5px;color:var(--tx3);margin-top:1px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;box-shadow:var(--sh)}
.syn i{width:7px;height:7px;border-radius:50%;background:var(--grn);flex-shrink:0}
.syn.off i{background:var(--org)}
.syn.err i{background:var(--red)}
.syn.ing i{background:var(--pri);animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:13.5px;font-weight:500;box-shadow:var(--sh);transition:.15s}
.btn:hover{border-color:#cfd4dc;color:var(--tx)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}

/* ---------- banner ---------- */
.bn{display:none;align-items:center;gap:9px;background:var(--org-l);border:1px solid #fbe3b8;color:#8a5a00;border-radius:var(--r2);padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.bn.on{display:flex}
.bn button{margin-left:auto;color:#8a5a00;font-weight:600;flex-shrink:0}

/* ---------- today ---------- */
.today{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.today-h{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.today-h h2{font-size:15px;font-weight:640}
.today-h .cnt{font-size:12px;color:var(--tx3);background:var(--bg);padding:2px 9px;border-radius:20px;font-weight:500}
.today-h .cnt.red{background:var(--red-l);color:var(--red)}
.today-b{padding:8px 12px 12px}
.ti{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:var(--r2);transition:.12s}
.ti:hover{background:var(--bg)}
.ti+.ti{border-top:1px solid var(--line2)}
.ti-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--pri-l);color:var(--pri)}
.ti-ic.od{background:var(--red-l);color:var(--red)}
.ti-ic.dn{background:var(--grn-l);color:var(--grn)}
.ti-m{flex:1;min-width:0}
.ti-t{font-size:14px;font-weight:520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-t.dn{text-decoration:line-through;color:var(--tx3);font-weight:400}
.ti-s{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12px;color:var(--tx3);flex-wrap:wrap}
.ti-a{display:flex;gap:6px;flex-shrink:0}
.chk{width:22px;height:22px;border-radius:6px;border:1.8px solid #cbd2dc;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;background:#fff}
.chk:hover{border-color:var(--pri)}
.chk.on{background:var(--grn);border-color:var(--grn)}

.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.1px}
.tag.p0{background:var(--red-l);color:var(--red)}
.tag.p1{background:var(--org-l);color:#b06f00}
.tag.p2{background:var(--bg);color:var(--tx3)}
.tag.od{background:var(--red);color:#fff}
.tag.sc{background:var(--pri-l);color:var(--pri)}
.empty{padding:26px 16px;text-align:center;color:var(--tx3);font-size:13.5px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}

/* ---------- focus card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--line2)}
.card-h h2{font-size:15px;font-weight:640}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:16px 18px 18px}

.fc-now{background:linear-gradient(150deg,#fff7fb 0%,#fdeef6 100%);border:1px solid #f8cfdf;border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.fc-now::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--pri)}
.fc-lb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:640;color:var(--pri);letter-spacing:.6px;margin-bottom:9px}
.fc-t{font-size:20px;font-weight:660;line-height:1.35;letter-spacing:-.2px;margin-bottom:11px;word-break:break-word}
.fc-m{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fc-p{background:rgba(255,255,255,.75);border:1px solid #f8cfdf;border-radius:var(--r2);padding:10px 12px;font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:14px;white-space:pre-wrap;word-break:break-word}
.fc-p:empty{display:none}
.fc-act{display:flex;gap:8px;flex-wrap:wrap}
.btn-lg{height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:560}
.fc-none{text-align:center;padding:22px 12px;color:var(--tx3);font-size:14px}
.fc-none svg{margin:0 auto 10px;opacity:.4}

/* ---------- pomodoro ---------- */
.pm{display:flex;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--line2);margin-top:4px;flex-wrap:wrap}
.pm-ring{position:relative;width:88px;height:88px;flex-shrink:0}
.pm-ring svg{transform:rotate(-90deg)}
.pm-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pm-txt b{font-size:19px;font-weight:660;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pm-txt span{font-size:10.5px;color:var(--tx3);margin-top:1px}
.pm-c{flex:1;min-width:150px}
.pm-c .row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.pm-st{font-size:12.5px;color:var(--tx2);font-weight:520}
.pm-dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.pm-dot.on{background:var(--grn)}
.pm-dot.run{background:var(--red);animation:pl 1.4s infinite}
.mini{height:28px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;color:var(--tx2);font-weight:520}
.mini:hover{border-color:#cfd4dc;color:var(--tx)}

/* ---------- note ---------- */
.nt{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.nt-l{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.nt textarea{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);resize:vertical;font-size:16px;line-height:1.55}
.nt textarea:focus{outline:none;border-color:var(--pri);background:#fff}
.nt-f{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.nt-hint{font-size:12px;color:var(--tx3)}

/* ---------- pool ---------- */
.pl-tabs{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.pl-tab{height:30px;padding:0 12px;border-radius:20px;background:var(--bg);border:1px solid transparent;font-size:13px;color:var(--tx2);font-weight:520;display:inline-flex;align-items:center;gap:6px}
.pl-tab.on{background:var(--pri-l);border-color:#f6c3d8;color:var(--pri)}
.pl-tab b{font-size:11px;opacity:.65;font-weight:600}
.pl-b{padding:10px 12px 14px;max-height:520px;overflow-y:auto}
.pi{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:var(--r2);transition:.12s;cursor:pointer;border:1px solid transparent}
.pi:hover{background:var(--bg)}
.pi.on{background:var(--pri-l);border-color:#f6c3d8}
.pi-m{flex:1;min-width:0}
.pi-t{font-size:13.8px;font-weight:520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-t.dn{text-decoration:line-through;color:var(--tx3);font-weight:400}
.pi-s{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:11.5px;color:var(--tx3);flex-wrap:wrap}
.pi-a{display:flex;gap:5px;flex-shrink:0;opacity:0;transition:.15s}
.pi:hover .pi-a,.pi.on .pi-a{opacity:1}
.icb{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--tx3);transition:.12s}
.icb:hover{background:#e9ecf1;color:var(--tx)}
.icb.del:hover{background:var(--red-l);color:var(--red)}

/* ---------- stats ---------- */
.st-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.st{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);padding:12px 13px}
.st b{display:block;font-size:22px;font-weight:660;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.2}
.st span{font-size:11.5px;color:var(--tx3);display:block;margin-top:2px}
.bars{padding:4px 0 2px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-n{font-size:12.5px;color:var(--tx2);width:74px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{flex:1;height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar-f{height:100%;border-radius:5px;transition:width .4s ease}
.bar-v{font-size:12px;color:var(--tx3);width:44px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* ---------- line filter ---------- */
.lf{display:flex;gap:6px;padding:0 14px 11px;flex-wrap:wrap;align-items:center}
.lf-l{font-size:11.5px;color:var(--tx3);margin-right:2px}
.lf-b{height:26px;padding:0 10px;border-radius:16px;background:var(--bg);border:1px solid transparent;font-size:12px;color:var(--tx2);font-weight:520;display:inline-flex;align-items:center;gap:5px}
.lf-b i{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.lf-b.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.lf-b.on i{box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}

/* ---------- heatmap ---------- */
.hm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.hm-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hm-h b{font-size:12.5px;font-weight:600;color:var(--tx2)}
.hm-h .r{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3)}
.hm-h .r i{width:9px;height:9px;border-radius:2px;display:block}
.hm-g{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.hm-c{aspect-ratio:1;border-radius:3px;background:#eef0f3;position:relative;cursor:default}
.hm-c.wk{background:transparent}
.hm-l{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:5px}
.hm-l span{font-size:9.5px;color:var(--tx3);text-align:center;overflow:hidden;white-space:nowrap}
.hm-leg{display:flex;align-items:center;gap:4px;margin-left:6px}

/* ---------- wow ---------- */
.wow-t{width:100%;border-collapse:collapse;font-size:12.8px}
.wow-t th{text-align:right;font-size:11px;font-weight:600;color:var(--tx3);padding:0 0 7px;border-bottom:1px solid var(--line2);white-space:nowrap}
.wow-t th:first-child{text-align:left}
.wow-t td{padding:9px 0;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wow-t td:first-child{text-align:left;font-weight:560}
.wow-t tr:last-child td{border-bottom:none}
.wow-n{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px}
.wow-n.up{color:var(--red)}
.wow-n.dn{color:var(--grn)}
.wow-n.flat{color:var(--tx3)}
.wow-n i{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;display:block}
.wow-n.up i{border-bottom:5px solid var(--red)}
.wow-n.dn i{border-top:5px solid var(--grn)}
.wow-e{text-align:center;color:var(--tx3);font-size:12.5px;padding:18px 0}
.wow-f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.wow-f label{display:block;font-size:11.5px;color:var(--tx2);font-weight:560;margin-bottom:4px}
.wow-f input,.wow-f select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r2);background:#fff}
.wow-f input:focus,.wow-f select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.wow-sum{margin-top:12px;padding:11px 13px;background:var(--bg);border-radius:var(--r2);font-size:12.5px;color:var(--tx2);line-height:1.7}
.wow-sum b{color:var(--tx)}

/* ---------- sakura fx ---------- */
.petal{position:fixed;z-index:9999;pointer-events:none;width:10px;height:10px;background:linear-gradient(135deg,#ffd9ea,#f9a8c9);border-radius:120% 0 120% 0;box-shadow:inset 0 0 2px rgba(255,255,255,.85);will-change:transform,opacity;animation:petalDrift var(--t,1.4s) ease-out forwards}
.petal.burst{animation-name:petalBurst;animation-timing-function:cubic-bezier(.2,.6,.3,1)}
@keyframes petalDrift{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  12%{opacity:.95}
  100%{transform:translate(var(--dx,20px),var(--dy,70px)) rotate(var(--rot,180deg));opacity:0}
}
@keyframes petalBurst{
  0%{transform:translate(0,0) scale(.5) rotate(0deg);opacity:1}
  70%{opacity:1}
  100%{transform:translate(var(--dx,80px),var(--dy,80px)) scale(1.1) rotate(var(--rot,270deg));opacity:0}
}
/* 烟花：星点四散 + 轻微重力下坠 */
.fx-dot{position:fixed;z-index:9998;pointer-events:none;width:7px;height:7px;border-radius:50%;background:var(--c,#ff8fb8);box-shadow:0 0 7px var(--c,#ff8fb8);animation:fwPop var(--t,1s) cubic-bezier(.12,.62,.4,1) forwards}
@keyframes fwPop{
  0%{transform:translate(0,0) scale(1.5);opacity:1}
  55%{opacity:1}
  100%{transform:translate(var(--dx,90px),calc(var(--dy,90px) + 30px)) scale(.15);opacity:0}
}
/* 主烟花的外扩光环，强化视觉重心 */
.fx-ring{position:fixed;z-index:9997;pointer-events:none;border:2px solid rgba(255,143,187,.75);border-radius:50%;animation:ringOut .72s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ringOut{
  0%{transform:translate(-50%,-50%) scale(.08);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}
/* 樱花绽放：5 片花瓣由中心展开 */
.fx-bloom{position:fixed;z-index:9998;pointer-events:none;width:0;height:0;font-size:var(--fs,26px)}
.fx-bloom em{position:absolute;left:-.28em;top:-.62em;width:.56em;height:.95em;background:linear-gradient(180deg,#fff0f6,#f78bb8);border-radius:60% 0 60% 0;transform-origin:50% 65%;opacity:.96}
.fx-bloom b{position:absolute;left:-.13em;top:-.13em;width:.26em;height:.26em;border-radius:50%;background:#fff6fa;box-shadow:0 0 6px rgba(255,167,205,.9)}
.fx-bloom.open{animation:bloomOpen var(--t,1.3s) cubic-bezier(.22,1.2,.36,1) forwards}
@keyframes bloomOpen{
  0%{transform:scale(.05) rotate(var(--r0,0deg));opacity:0}
  22%{opacity:1}
  62%{transform:scale(1.18) rotate(var(--r1,40deg));opacity:1}
  100%{transform:scale(.92) rotate(var(--r2,90deg));opacity:0}
}
@media (prefers-reduced-motion:reduce){.petal,.fx-dot,.fx-bloom{display:none}}

/* ---------- report ---------- */
.rp-t{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);font-size:13px;line-height:1.65;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- add form ---------- */
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm .f1{grid-column:1/-1}
.fm label{display:block;font-size:12px;color:var(--tx2);font-weight:560;margin-bottom:5px}
.fm input,.fm select,.fm textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r2);background:#fff;transition:.15s}
.fm textarea{height:auto;min-height:60px;padding:10px 12px;resize:vertical;line-height:1.55}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.fm-f{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:2px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.mask.on{display:flex}
.mdl{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(16,24,40,.22)}
.mdl h3{font-size:16.5px;font-weight:640;margin-bottom:9px}
.mdl p{font-size:14px;color:var(--tx2);line-height:1.6;margin-bottom:18px}
.mdl-f{display:flex;gap:9px;justify-content:flex-end}

/* ---------- toast ---------- */
.tst{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);background:#1a1d21;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.24s;z-index:200;box-shadow:var(--sh2);max-width:88vw;text-align:center}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap{padding:14px 12px 0}
  .hd{gap:10px}
  .hd h1{font-size:17px}
  .hd-r{margin-left:0;width:100%}
  .hd-r .btn{flex:1;justify-content:center}
  .fc-t{font-size:18px}
  .st-g{grid-template-columns:repeat(2,1fr)}

<script>
"use strict";
/* ========== 常量与状态 ========== */
var LS = "wb_focusdesk_";

var state = {

/* ========== 工具 ========== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function p2(n){ return n<10?"0"+n:""+n; }
function dOf(v){
  if(!v) return "";
  var s=String(v);
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+"-"+m[2]+"-"+m[3];
  var d=new Date(s);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function dayDiff(a,b){ // b - a，单位天
  if(!a||!b) return 0;
  var x=new Date(a+"T00:00:00"), y=new Date(b+"T00:00:00");
  return Math.round((y-x)/86400000);
}
function toast(m){
  var t=$("tst"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("on"); },2100);
}

/* ========== 计算层 ========== */
function isDone(t){ return t["状态"]==="已完成"; }
function isOverdue(t){ var d=dOf(t["截止日期"]); return !isDone(t) && d && d < today(); }
function todayTasks(){
  var td=today();
  return state.tasks.filter(function(t){ return !isDone(t) && (isOverdue(t) || dOf(t["截止日期"])===td || t["今日处理"]===true); });
}
function weekStart(){
  var d=new Date(); var w=d.getDay(); // 周日=0
  var off = (w===0?6:w-1);           // 周一为一周起点
  d.setDate(d.getDate()-off);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function weekStats(){
  var ws=weekStart(), td=today();
  var done=0;
  state.tasks.forEach(function(t){ if(isDone(t)){ var d=dOf(t["截止日期"])||""; if(d>=ws) done++; } });
  var mins=0;
  state.focus.forEach(function(f){ var d=dOf(f["日期"]); if(d>=ws&&d<=td) mins+=Number(f["专注分钟"])||0; });
  var todo=state.tasks.filter(function(t){return !isDone(t);}).length;
  var od=state.tasks.filter(isOverdue).length;
  return {done:done,mins:mins,todo:todo,od:od};
}

}

          : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>')

      +'<div class="pi-a">'

/* —— 日历热力图（近 15 周专注分钟） —— */
function renderHeat(){
  var grid=$("hmGrid"), lab=$("hmLabel"), sum=$("hmSum");
  var WEEKS=15;
  // 按 ISO 周聚合专注分钟
  var byWk={};
  state.focus.forEach(function(f){
    var d=dOf(f["日期"]); if(!d) return;
    var w=mondayOf(d);
    byWk[w]=(byWk[w]||0)+(Number(f["专注分钟"])||0);
  });
  var thisMon=mondayOf(today());
  var wks=[];
  for(var i=WEEKS-1;i>=0;i--){ wks.push(shiftDay(thisMon,-7*i)); }
  var max=0; wks.forEach(function(w){ if((byWk[w]||0)>max) max=byWk[w]; });

  var h="";
  wks.forEach(function(w){
    var v=byWk[w]||0;
    var bg="#eef0f3";
    if(v>0){
      var r=max? Math.min(1, v/max) : 0;
      var lv=Math.max(1, Math.ceil(r*4));   // 1~4 档
      bg=["#c7dbff","#7ba5ff","#4a80f5","#2f6bff"][lv-1];
    }
    h+='<div class="hm-c" style="background:'+bg+'" title="'+w+' 起当周 '+v+' 分钟"></div>';
  });
  grid.innerHTML=h;

  var lh="";
  wks.forEach(function(w,i){
    lh += (i%3===0 || i===WEEKS-1) ? '<span>'+w.slice(5).replace("-","/")+'</span>' : '<span></span>';
  });
  lab.innerHTML=lh;

  var tot=0,act=0;
  wks.forEach(function(w){ var v=byWk[w]||0; tot+=v; if(v>0) act++; });
  var cur=byWk[thisMon]||0;
  var prev=byWk[shiftDay(thisMon,-7)]||0;
  sum.innerHTML = '近 '+WEEKS+' 周共专注 <b>'+tot+'</b> 分钟，活跃 <b>'+act+'</b> 周；本周 <b>'+cur+'</b> 分钟，上周 '+prev+' 分钟'
    + (prev? ('，<b>'+(cur>=prev?'+':'')+Math.round((cur-prev)/prev*100)+'%</b>') : '');
}

function mondayOf(ds){
  if(!ds) return "";
  var d=new Date(ds+"T00:00:00");
  var w=d.getDay();
  var off=(w===0?6:w-1);
  d.setDate(d.getDate()-off);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function shiftDay(ds,n){
  var d=new Date(ds+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}

/* —— WoW 环比 —— */
function fmtN(v){
  if(v>=1000) return v.toLocaleString("en-US",{maximumFractionDigits:0});
  return String(Math.round(v*100)/100);
}
function pctBadge(cur,prev){
  // 颜色统一按涨跌方向：红涨绿跌（国内习惯）。好坏判断交给下方文字预警。
  if(prev===null||prev===undefined||!isFinite(prev)||prev===0){
    return '<span class="wow-n flat">—</span>';
  }
  if(cur===null||cur===undefined||!isFinite(cur)){
    return '<span class="wow-n flat">—</span>';
  }
  var d=(cur-prev)/prev*100;
  if(Math.abs(d)<0.5) return '<span class="wow-n flat">0%</span>';
  var up = d>0;
  return '<span class="wow-n '+(up?"up":"dn")+'" title="较上周 '+(up?"上升":"下降")+' '+Math.abs(Math.round(d))+'%">'
    +'<i></i>'+(up?"+":"")+Math.round(d)+'%</span>';
}
function renderWow(){
  var ws=weekStart();
  var prevWk=shiftDay(ws,-7);
  $("wowWk").textContent=ws+" 起";

  var rows=LINES.map(function(l){
    var cur=null,prev=null;
    state.wow.forEach(function(r){
      var d=dOf(r["周起始日"]);
      if(r["业务线"]!==l) return;
      if(d===ws) cur=r;
      if(d===prevWk) prev=r;
    });
    return {line:l,cur:cur,prev:prev};
  }).filter(function(r){ return r.cur||r.prev; });

  var tb=$("wowBody");
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="4" class="wow-e">还没有周数据 —— 在上方选业务线、填费用和 Leads 保存后，这里会自动算 CPL 和环比</td></tr>';
    $("wowSum").innerHTML="";
    return;
  }
  var h="";
  var tC=0,tL=0,pC=0,pL=0;
  rows.forEach(function(r){
    var c=r.cur, p=r.prev;

      +'<td>'+(cpl===null?"—":"$"+(Math.round(cpl*100)/100))+'<br>'+pctBadge(cpl,ppl,true)+'</td>'
      +'</tr>';
  });
  tb.innerHTML=h;

  var tcpl = tL? tC/tL : null;
  var pcpl = pL? pC/pL : null;

       +' · Leads <b>'+fmtN(tL)+'</b> '+pctBadge(tL,pL,false)
       +' · CPL <b>'+(tcpl===null?"—":"$"+(Math.round(tcpl*100)/100))+'</b> '+pctBadge(tcpl,pcpl,true);
  var warn=[];
  rows.forEach(function(r){

    }
    if(pl>0 && cl===0){
      warn.push(r.line+" 本周 Leads 归零，检查转化追踪");

/* ========== 数据层（Cloudflare Worker + KV，localStorage 兜底） ========== */
function apiBase(){
  var v=localStorage.getItem(LS+"api");
  if(v===null || v==="") return DEFAULT_API;
  return String(v).replace(/\/+$/,"");
}
function syncCode(){ return localStorage.getItem(LS+"code")||""; }
function hasSync(){ return !!syncCode() && !!apiBase(); }
function unwrap(v){
  if(v===null||v===undefined) return "";
  if(typeof v==="object"){
    if(v.text!==undefined) return v.text;
    if(v.select!==undefined) return v.select;
    if(v.checkbox!==undefined) return v.checkbox;
    if(v.date!==undefined) return v.date;
    if(v.number!==undefined) return v.number;
    if(v.currency!==undefined) return v.currency;
    return "";
  }
  return v;
}
function snap(){
  return {
    v:1, updatedAt:Date.now(), curId:state.curId,
    tasks:state.tasks, focus:state.focus, wow:state.wow,
    notes:state.tasks.map(function(t){ return {id:t._id,n:t._note||"",a:t._noteAt||""}; })
  };
}
function applySnap(d){
  if(!d||typeof d!=="object") return false;
  // 远端快照比本地更旧时拒绝覆盖，避免刚写就被拉回
  if(d.updatedAt && state.lastAt && d.updatedAt < state.lastAt-2000) return false;
  state.tasks=d.tasks||[]; state.focus=d.focus||[]; state.wow=d.wow||[];
  var nm={}; (d.notes||[]).forEach(function(x){ nm[x.id]={n:x.n,a:x.a}; });
  state.tasks.forEach(function(t){ if(nm[t._id]){ t._note=nm[t._id].n; t._noteAt=nm[t._id].a; } });
  if(d.curId) state.curId=d.curId;
  if(d.updatedAt) state.lastAt=d.updatedAt;
  return true;
}

function saveLocal(){
  try{
    localStorage.setItem(LS+"tasks", JSON.stringify(state.tasks));
    localStorage.setItem(LS+"focus", JSON.stringify(state.focus));
    localStorage.setItem(LS+"wow", JSON.stringify(state.wow));
    localStorage.setItem(LS+"cur", state.curId);
    localStorage.setItem(LS+"notes", JSON.stringify(state.tasks.map(function(t){return {id:t._id,n:t._note||"",a:t._noteAt||""};})));
  }catch(e){}
}
function loadLocal(){
  try{
    var t=JSON.parse(localStorage.getItem(LS+"tasks")||"[]");
    var f=JSON.parse(localStorage.getItem(LS+"focus")||"[]");
    var w=JSON.parse(localStorage.getItem(LS+"wow")||"[]");
    var n=JSON.parse(localStorage.getItem(LS+"notes")||"[]");
    var nmap={}; n.forEach(function(x){ nmap[x.id]={n:x.n,a:x.a}; });
    t.forEach(function(x){ if(nmap[x._id]){ x._note=nmap[x._id].n; x._noteAt=nmap[x._id].a; } });
    return {t:t,f:f,w:w,cur:localStorage.getItem(LS+"cur")||""};
  }catch(e){ return {t:[],f:[],w:[],cur:""}; }
}

/* 远端拉取 */
function pullRemote(){
  if(!hasSync()) return Promise.reject(new Error("no-config"));
  setSyn("ing","同步中");
  return fetch(apiBase()+API_PATH+"?code="+encodeURIComponent(syncCode()),{method:"GET",headers:{"Accept":"application/json"},cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      var d=(j&&j.data!==undefined)?j.data:j;
      if(d && (d.tasks||d.focus||d.wow) && !applySnap(d)){ setSyn("","已同步"); return; }
      state.mode="cloud";
      saveLocal();
      setSyn("","已同步");
    });
}

/* 远端推送（防抖合并） */
var _pt=null;
function pushRemote(){
  if(!hasSync()) return Promise.resolve();
  if(_pt) clearTimeout(_pt);
  return new Promise(function(res){
    _pt=setTimeout(function(){
      _pt=null;
      setSyn("ing","同步中");
      var s=snap(); state.lastAt=s.updatedAt;
      fetch(apiBase()+API_PATH+"?code="+encodeURIComponent(syncCode()),{
        method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)
      }).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); setSyn("","已同步"); res(); })
        .catch(function(){ setSyn("err","同步失败"); res(); });
    },500);
  });
}
/* 统一写入：改内存 → 落本地 → 推云端 */
function commit(){ saveLocal(); return pushRemote(); }

/* 保留旧名，兼容既有调用点 */
function fetchData(){
  if(!hasSync()){ state.mode="local"; return Promise.resolve(); }
  return pullRemote().catch(function(err){
    state.mode="local";
    setSyn("err","同步失败");
    $("bntx").textContent="云端同步失败，当前展示本地数据";
    $("bn").classList.add("on");
  });
}

function pushTask(props, id){
  var p={};
  for(var k in props){ if(props[k]!==undefined && props[k]!==null) p[k]=props[k]; }
  if(id){
    for(var i=0;i<state.tasks.length;i++){
      if(state.tasks[i]._id===id){ for(var k2 in p){ state.tasks[i][k2]=unwrap(p[k2]); } break; }
    }
  }else{
    var o={_id:"l_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)};
    for(var k3 in p){ o[k3]=unwrap(p[k3]); }
    state.tasks.push(o);
  }
  return commit();
}
function delTask(id){
  state.tasks=state.tasks.filter(function(t){return t._id!==id;});
  if(state.curId===id) state.curId="";
  return commit();
}
function pushFocus(props){
  var o={_id:"f_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)};
  for(var k in props){ o[k]=unwrap(props[k]); }
  state.focus.push(o);
  return commit();
}

/* ========== 樱花特效层（独立，不触碰业务状态） ========== */
var fxCount=0;
var CELEB="firework";                                   // firework | bloom | mixed
function fxPetals(x,y,n,mode){
  if(fxCount>80) return;
  for(var i=0;i<n;i++){
    (function(){
      var p=document.createElement("div");
      p.className="petal"+(mode==="burst"?" burst":"");
      var s=6+Math.random()*8;
      p.style.width=s.toFixed(1)+"px"; p.style.height=s.toFixed(1)+"px";
      p.style.left=x.toFixed(0)+"px"; p.style.top=y.toFixed(0)+"px";
      var dx,dy;
      if(mode==="burst"){
        var ang=Math.random()*Math.PI*2, dist=60+Math.random()*130;
        dx=Math.cos(ang)*dist; dy=Math.sin(ang)*dist;
      }else{
        dx=Math.random()*70-35; dy=45+Math.random()*70;
      }
      p.style.setProperty("--dx",dx.toFixed(0)+"px");
      p.style.setProperty("--dy",dy.toFixed(0)+"px");
      p.style.setProperty("--rot",(Math.random()*540-270).toFixed(0)+"deg");
      var t=mode==="burst"?0.9+Math.random()*0.6:1.3+Math.random()*0.8;
      p.style.setProperty("--t",t.toFixed(2)+"s");
      fxCount++;
      p.addEventListener("animationend",function(){ fxCount--; if(p.parentNode) p.parentNode.removeChild(p); });
      document.body.appendChild(p);
    })();
  }
}
var FX_PAL=["#ff6fa5","#ff90bb","#f9a8c9","#ffc2d8","#fff0f6","#ffb3cd"];
function fxFirework(x,y,n,k){
  k=k||1;
  if(fxCount>180) return;
  for(var i=0;i<n;i++){
    (function(){
      var d=document.createElement("div");
      d.className="fx-dot";
      var size=(5+Math.random()*5)*k;
      d.style.width=size.toFixed(1)+"px"; d.style.height=size.toFixed(1)+"px";
      d.style.left=x.toFixed(0)+"px"; d.style.top=y.toFixed(0)+"px";
      var ang=(Math.PI*2/n)*i + (Math.random()*0.5-0.25);
      var dist=(45+Math.random()*85)*k;
      d.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px");
      d.style.setProperty("--dy",(Math.sin(ang)*dist).toFixed(0)+"px");
      d.style.setProperty("--t",((0.75+Math.random()*0.6)*(k>1.2?1.15:1)).toFixed(2)+"s");
      d.style.setProperty("--c",FX_PAL[(Math.random()*FX_PAL.length)|0]);
      fxCount++;
      d.addEventListener("animationend",function(){ fxCount--; if(d.parentNode) d.parentNode.removeChild(d); });
      document.body.appendChild(d);
    })();
  }
}
function fxRing(x,y,d){
  (function(){
    var r=document.createElement("div");
    r.className="fx-ring";
    r.style.left=x.toFixed(0)+"px"; r.style.top=y.toFixed(0)+"px";
    r.style.width=d+"px"; r.style.height=d+"px";
    document.body.appendChild(r);
    r.addEventListener("animationend",function(){ if(r.parentNode) r.parentNode.removeChild(r); });
  })();
}
function fxBloom(x,y,fs){
  if(fxCount>200) return;
  (function(){
    var b=document.createElement("div");
    b.className="fx-bloom open";
    b.style.left=x.toFixed(0)+"px"; b.style.top=y.toFixed(0)+"px";
    b.style.setProperty("--fs",(fs||26).toFixed(0)+"px");
    var r0=Math.random()*360, r1=r0+(Math.random()*200-100), r2=r1+(Math.random()*80-40);
    b.style.setProperty("--r0",r0.toFixed(0)+"deg");
    b.style.setProperty("--r1",r1.toFixed(0)+"deg");
    b.style.setProperty("--r2",r2.toFixed(0)+"deg");
    b.style.setProperty("--t",(1.0+Math.random()*0.6).toFixed(2)+"s");
    var h="";
    for(var i=0;i<5;i++) h+='<em style="transform:rotate('+(i*72)+'deg)"></em>';
    h+='<b></b>';
    b.innerHTML=h;
    fxCount++;
    b.addEventListener("animationend",function(){ fxCount--; if(b.parentNode) b.parentNode.removeChild(b); });
    document.body.appendChild(b);
  })();
}
function fxCelebrate(mode){
  mode=mode||CELEB;
  var w=window.innerWidth,h=window.innerHeight;
  var spots=[[0.5,0.34],[0.28,0.42],[0.72,0.40],[0.4,0.55],[0.62,0.52]];
  if(mode==="firework"){
    fxRing(w*spots[0][0],h*spots[0][1],190);
    fxFirework(w*spots[0][0],h*spots[0][1],32,1.6);
    setTimeout(function(){ fxFirework(w*spots[1][0],h*spots[1][1],16,1); },170);
    setTimeout(function(){ fxFirework(w*spots[2][0],h*spots[2][1],18,1); },360);
  }else if(mode==="bloom"){
    fxPetals(w*0.5,h*0.36,10,"burst");
    spots.forEach(function(s,i){
      setTimeout(function(){ fxBloom(w*s[0],h*s[1],24+Math.random()*16); },i*130);
    });
  }else{
    fxRing(w*spots[0][0],h*spots[0][1],170);
    fxFirework(w*spots[0][0],h*spots[0][1],24,1.45);
    setTimeout(function(){ fxBloom(w*0.32,h*0.42,30); fxPetals(w*0.32,h*0.42,6,"burst"); },180);
    setTimeout(function(){ fxFirework(w*0.7,h*0.38,18,1); },300);
    setTimeout(function(){ fxBloom(w*0.68,h*0.5,26); },420);
    setTimeout(function(){ fxBloom(w*0.45,h*0.55,20); },540);
  }
}
document.addEventListener("click",function(e){
  fxPetals(e.clientX,e.clientY,3,"drift");
});

/* ========== 事件层 ========== */
function onAct(e){
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  if(act==="done"){
    var t=findT(id);
    if(!t) return;
    var nv = isDone(t) ? "待办":"已完成";
    pushTask({"状态":{select:nv}},id).then(function(){
      t["状态"]=nv;
      if(nv==="已完成" && state.curId===id){
        var l=todayTasks().filter(function(x){return x._id!==id;});
        state.curId = l.length? l[0]._id : "";
        localStorage.setItem(LS+"cur",state.curId);
      }
      toast(nv==="已完成"?"已完成 ✓":"已恢复待办");
      if(nv==="已完成") fxCelebrate();
      saveLocal(); refreshAll();
    }).catch(function(){ toast("保存失败，请重试"); });
  }
  else if(act==="focus" || act==="pick"){
    state.curId=id; localStorage.setItem(LS+"cur",id);
    var t2=findT(id);
    if(t2 && t2["状态"]!=="进行中" && !isDone(t2)){
      pushTask({"状态":{select:"进行中"}},id).then(function(){ t2["状态"]="进行中"; saveLocal(); refreshAll(); }).catch(function(){ refreshAll(); });
    }else{ refreshAll(); }
    if(window.innerWidth<900) window.scrollTo({top:document.querySelector(".grid").offsetTop-14,behavior:"smooth"});
  }
  else if(act==="start"){
    pmSet(state.pm.min); pmToggle();
  }
  else if(act==="drop"){
    state.curId=""; localStorage.setItem(LS+"cur","");
    refreshAll();
  }
  else if(act==="del"){
    var t3=findT(id); if(!t3) return;
    confirmBox("删除任务","确定删除「"+t3["任务"]+"」？删除后不可恢复。",function(){
      delTask(id).then(function(){
        state.tasks=state.tasks.filter(function(x){return x._id!==id;});
        if(state.curId===id){ state.curId=""; localStorage.setItem(LS+"cur",""); }
        saveLocal(); refreshAll(); toast("已删除");
      }).catch(function(){ toast("删除失败，请重试"); });
    });
  }
}
function findT(id){
  for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i]._id===id) return state.tasks[i]; }
  return null;
}

document.addEventListener("click", function(e){
  if(e.target.closest("#todayList") || e.target.closest("#fcBox") || e.target.closest("#plBody")){ onAct(e); return; }
  var tab=e.target.closest(".pl-tab");
  if(tab){ state.scene=tab.getAttribute("data-sc"); renderPool(); return; }
  var ln=e.target.closest(".lf-b");
  if(ln){ state.line=ln.getAttribute("data-ln"); renderLines(); renderPool(); return; }
  var mn=e.target.closest(".mini");
  if(mn){ pmSet(parseInt(mn.getAttribute("data-min"),10)); return; }
});

/* 番茄钟 */
function pmSet(m){ state.pm.min=m; state.pm.left=m*60; state.pm.run=false; clearInterval(state.pm.timer); renderPm(); }
function pmToggle(){
  if(state.pm.run){
    state.pm.run=false; clearInterval(state.pm.timer); renderPm(); return;
  }
  if(!state.curId){ toast("请先选一个专注任务"); return; }
  state.pm.run=true;
  state.pm.timer=setInterval(function(){
    state.pm.left--;
    if(state.pm.left<=0){
      clearInterval(state.pm.timer);
      state.pm.run=false; state.pm.left=0;
      var t=findT(state.curId);
      pushFocus({"日期":{date:today()},"任务":{text:t?t["任务"]:"（未指定）"},"场景":{select:(t&&t["场景"])||"投放执行"},"专注分钟":{number:state.pm.min},"备注":{text:"番茄钟完成"}})
        .then(function(){ return fetchData(); })
        .then(function(){ refreshAll(); })
        .catch(function(){ refreshAll(); });
      toast("专注完成！已记录 "+state.pm.min+" 分钟");
      state.pm.left=state.pm.min*60;
    }
    renderPm();
  },1000);
  renderPm();
}
$("pmStart").onclick=pmToggle;
$("pmReset").onclick=function(){ pmSet(state.pm.min); };

    return fetchData();
  }).then(function(){ refreshAll(); toast("任务已创建"); })
    .catch(function(){ refreshAll(); toast("保存失败，请检查网络"); });
};

/* WoW 数据保存（同业务线+同周起始日覆盖更新） */
$("wSave").onclick=function(){
  var line=$("wLine").value;
  var wk=$("wDate").value || weekStart();
  wk=mondayOf(wk);
  var cost=parseFloat($("wCost").value);
  var leads=parseInt($("wLeads").value,10);
  if(!isFinite(cost) && !isFinite(leads)){ toast("请至少填写费用或 Leads"); return; }
  if(!isFinite(cost)) cost=0;
  if(!isFinite(leads)) leads=0;

  var exist=null;
  for(var i=0;i<state.wow.length;i++){
    var r=state.wow[i];
    if(r["业务线"]===line && dOf(r["周起始日"])===wk){ exist=r; break; }
  }
  var p;
  if(exist){
    exist["业务线"]=line; exist["周起始日"]=wk; exist["费用"]=cost; exist["Leads"]=leads;
    p=commit();
  }else{
    state.wow.push({_id:"w_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),"业务线":line,"周起始日":wk,"费用":cost,"Leads":leads});
    p=commit();
  }
  p.then(function(){ refreshAll(); toast(exist?"已更新本周数据":"已保存本周数据"); })
   .catch(function(){ refreshAll(); toast("保存失败，请检查网络"); });
};

/* 周报生成 */
$("rpGen").onclick=function(){
  var ws=weekStart(), td=today();
  var s=weekStats();
  var done=state.tasks.filter(function(t){ if(!isDone(t)) return false; var d=dOf(t["截止日期"])||""; return d>=ws; });
  var doing=state.tasks.filter(function(t){return t["状态"]==="进行中";});
  var od=state.tasks.filter(isOverdue);
  var L=[];
  L.push("【本周周报】"+ws+" ~ "+td);
  L.push("");
  L.push("一、整体（发生什么 / 意味着什么）");
  L.push("· 本周完成 "+s.done+" 项，专注累计 "+s.mins+" 分钟");
  L.push("· 当前待办 "+s.todo+" 项，其中逾期 "+s.od+" 项");
  if(od.length){
    L.push("· ⚠️ 风险：以下任务已逾期，需优先处理或明确调整：");
    od.forEach(function(t){ L.push("   - "+t["任务"]+"（"+t["场景"]+" / "+t["优先级"]+" / 截止 "+dOf(t["截止日期"])+"）"); });
  }else{
    L.push("· 无逾期项，节奏正常");
  }
  L.push("");
  L.push("二、已完成");
  if(done.length){ done.forEach(function(t,i){ L.push((i+1)+". "+t["任务"]+"（"+t["场景"]+" / "+t["优先级"]+"）"); }); }
  else L.push("（本周暂无已完成项）");
  L.push("");
  L.push("三、进行中");
  if(doing.length){ doing.forEach(function(t,i){ L.push((i+1)+". "+t["任务"]+"（"+t["场景"]+" / "+t["优先级"]+"）"); }); }
  else L.push("（无）");
  L.push("");
  L.push("四、时间投入分布");
  var any=false;
  SCENES.forEach(function(sc){
    var m=0,c2=0;
    state.focus.forEach(function(f){ if(f["场景"]===sc){ m+=Number(f["专注分钟"])||0; c2++; } });
    if(m>0){ L.push("· "+sc+"："+m+" 分钟（"+c2+" 次专注）"); any=true; }
  });
  if(!any) L.push("（本周暂无专注记录）");
  L.push("");
  L.push("五、业务线 WoW 环比（本周 vs 上周）");
  var pv=shiftDay(ws,-7), hasW=false;
  LINES.forEach(function(l){
    var c=null,pp=null;
    state.wow.forEach(function(r){
      var d=dOf(r["周起始日"]);
      if(r["业务线"]!==l) return;
      if(d===ws) c=r; if(d===pv) pp=r;
    });
    if(!c && !pp) return;
    hasW=true;
    var cc=c?Number(c["费用"])||0:0, cl=c?Number(c["Leads"])||0:0;
    var pc=pp?Number(pp["费用"])||0:0, pl=pp?Number(pp["Leads"])||0:0;
    var cpl=cl?cc/cl:null, ppl=pl?pc/pl:null;
    var pc2=function(a,b){ if(!b) return "—"; var x=(a-b)/b*100; return (x>0?"+":"")+Math.round(x)+"%"; };
    L.push("· "+l+"：费用 $"+fmtN(cc)+"（"+pc2(cc,pc)+"） / Leads "+fmtN(cl)+"（"+pc2(cl,pl)+"） / CPL "+(cpl===null?"—":"$"+(Math.round(cpl*100)/100))+"（"+((cpl===null||ppl===null)?"—":pc2(cpl,ppl))+"）");
  });
  if(!hasW) L.push("（本周暂无业务线数据）");
  L.push("");
  L.push("六、下一步计划");
  var nxt=state.tasks.filter(function(t){return !isDone(t);}).sort(function(a,b){var p={"P0":0,"P1":1,"P2":2};return (p[a["优先级"]]||9)-(p[b["优先级"]]||9);}).slice(0,5);
  nxt.forEach(function(t,i){ L.push((i+1)+". "+t["任务"]+"（"+t["优先级"]+" / "+t["场景"]+"）"); });
  $("rpTa").value=L.join("\n");
  toast("周报已生成");
};
$("rpCopy").onclick=function(){
  var v=$("rpTa").value;
  if(!v){ toast("请先生成周报"); return; }
  var ta=$("rpTa"); ta.removeAttribute("readonly"); ta.select(); ta.setSelectionRange(0,99999);
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  ta.setAttribute("readonly","readonly");
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(v).then(function(){toast("已复制到剪贴板");}); return; }
  toast(ok?"已复制到剪贴板":"复制失败，请手动选中复制");
};

/* 导出备份 */
$("btnExport").onclick=function(){
  var data={exportAt:new Date().toISOString(),tasks:state.tasks,focus:state.focus,curId:state.curId};
  var b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="focusdesk-backup-"+today()+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast("备份已导出");
};
$("bnx").onclick=function(){ $("bn").classList.remove("on"); };

/* 云同步设置 */
function renderSyncCfg(){
  if(!$("scCode")) return;
  $("scCode").value=syncCode();
  $("scApi").value=localStorage.getItem(LS+"api")||"";
}
$("btnSync").onclick=function(){ renderSyncCfg(); $("mSync").classList.add("on"); };
$("scClose").onclick=function(){ $("mSync").classList.remove("on"); };
$("mSync").onclick=function(e){ if(e.target===this) this.classList.remove("on"); };
$("scPull").onclick=function(){
  if(!hasSync()){ toast("请先填写同步码并保存"); return; }
  pullRemote().then(function(){ refreshAll(); toast("已拉取云端数据"); })
              .catch(function(){ toast("拉取失败，检查同步码与 API 地址"); });
};
$("scSave").onclick=function(){
  var code=$("scCode").value.trim(), api=$("scApi").value.trim();
  if(!code){ toast("同步码不能为空"); return; }
  localStorage.setItem(LS+"code",code);
  localStorage.setItem(LS+"api",api);
  state.mode="cloud";
  $("mSync").classList.remove("on");
  pullRemote().then(function(){
    refreshAll();
    if(!state.tasks.length){ seedLocal(); refreshAll(); }
    return commit();
  }).then(function(){ toast("已开启云同步"); })
    .catch(function(){
      state.mode="cloud";
      commit().then(function(){ toast("已保存，本地数据正在上传"); });
    });
};

/* ========== 初始化（防御性：单一入口） ========== */
function initSelects(){
  var opt=LINES.map(function(l){ return '<option value="'+l+'">'+l+'</option>'; }).join("");
  $("fLine").innerHTML=opt;
  $("wLine").innerHTML=opt;
  $("wDate").value=weekStart();
}

function init(){
  initSelects();
  var d=loadLocal();
  state.tasks=d.t; state.focus=d.f; state.wow=d.w; state.curId=d.cur;
  refreshAll();                                  // 先用本地缓存渲染，避免白屏
  if(!state.tasks.length){ seedLocal(); refreshAll(); }
  if(!state.curId){ var l=todayTasks(); if(l.length) state.curId=l[0]._id; refreshAll(); }

  if(hasSync()){
    state.mode="cloud";
    pullRemote().then(function(){ refreshAll(); })
      .catch(function(){
        state.mode="local";
        setSyn("err","同步失败");
        $("bntx").textContent="云端同步失败，当前展示本地数据";
        $("bn").classList.add("on");
      });
  }else{
    state.mode="local";
    setSyn("off","本地模式");
    $("bntx").textContent="未开启云同步，数据仅存本设备。点右上角同步按钮可开启多设备同步";
    $("bn").classList.add("on");
  }
  renderSyncCfg();
}

/* 首次打开播撒示例任务（含 1 条逾期），可一键清空 */
function seedLocal(){
  var td=today();
  var mk=function(n,sc,pr,due,td2,note,st,line){
    return {_id:"l_"+Math.random().toString(36).slice(2,9),"任务":n,"场景":sc,"状态":st||"待办","优先级":pr,"截止日期":due,"今日处理":td2,"业务线":line,"备注":note};
  };
  var y=new Date(); y.setDate(y.getDate()-2);
  var ys=y.getFullYear()+"-"+p2(y.getMonth()+1)+"-"+p2(y.getDate());
  state.tasks=[
    mk("Readdy GG 搜索词报告清理 + 否定词补录","数据分析诊断","P0",ys,true,"搜索词里无效词占比偏高，需补否定词并核对归因","进行中","Readdy-GG"),
    mk("Readdy GG PMax 素材组轮换（3 组新图 + 标题）","投放执行","P0",td,true,"素材轮换周期到，含 freewebsite 落地页配套文案","待办","Readdy-GG"),
    mk("Readdy 本周 WoW 复盘（费用 / Leads / CPL）","周报汇报","P1",td,true,"对比上周，标注异动与判断","待办","Readdy-GG"),
    mk("Readdy CPL 落地页 CAPI 事件质量核对","对外沟通","P1",shiftDay(td,2),false,"event match quality 偏低，与工程确认参数回传","待办","Readdy-GG"),
    mk("AI GeoLens 支付校验修复","个人项目","P2",shiftDay(td,5),false,"PayPal Live 环境变量配置 + 免费后门修复","待办","个人项目")
  ];
  state.curId=state.tasks[0]._id;
  saveLocal();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
